[workspace]
resolver = "2"
members = ["halo-map", "halo-sim", "halo-sim-parity", "halo-wire"]
# SpacetimeDB crates, their own workspaces: see each Cargo.toml
exclude = ["halo-match-module", "halo-match-driver"]

[workspace.package]
edition = "2021"
publish = false

# The WebAssembly runtime the parity test runs the simulation in is an
# interpreter; optimised, it runs the 10,000-tick scenario in a second or two
# instead of minutes.
[profile.dev.package."*"]
opt-level = 3
